<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Parking Lot</title>

    <!-- Bootstrap CSS only -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin-top: 50px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .btn {
            margin-right: 10px;
        }
    </style>
</head>
<body>  

<div class="container">

    <h2>Edit Parking Lot</h2>
    <form method="POST">
        <div class="form-group">
            <label for="prime_location_name">Prime Location Name:</label>
            <input type="text" class="form-control" id="prime_location_name" name="prime_location_name" value="{{ lot.prime_location_name }}" required>
        </div>
        <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" class="form-control" id="address" name="address" value="{{ lot.address }}" required>
        </div>
        <div class="form-group">
            <label for="pincode">Pincode:</label>
            <input type="text" class="form-control" id="pincode" name="pincode" value="{{ lot.pincode }}" required>
        </div>
        <div class="form-group">
            <label for="price">Price Per Hour:</label>
            <input type="number" class="form-control" id="price" name="price" value="{{ lot.price }}" required>
        </div>
        <div class="form-group">
            <label for="maximum_number_of_spots">Maximum Spots:</label>
            <input type="number" class="form-control" id="maximum_number_of_spots" name="maximum_number_of_spots" value="{{ lot.maximum_number_of_spots }}" min="1"  max="30">
        </div>
        <button type="submit" class="btn btn-info">Update Lot</button>
        <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-default">Cancel</a>
    </form>
</div>

</body>
</html>
