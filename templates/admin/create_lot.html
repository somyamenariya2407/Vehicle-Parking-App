<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Add Parking Lot</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <!-- Optional: Your custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin-top: 50px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        button {
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Add Parking Lot</h2>
        <form method="POST">
            <div class="form-group">
                <label for="prime_location_name">Lot Name:</label>
                <input type="text" class="form-control" name="prime_location_name" id="prime_location_name"
                    placeholder="Prime Location Name" required>
            </div>
            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" class="form-control" name="address" id="address" placeholder="Address" required>
            </div>
            <div class="form-group">
                <label for="price">Price/Hour:</label>
                <input type="text" class="form-control" name="price" id="price" placeholder="Price Per Hour" required>
            </div>
            <div class="form-group">
                <label for="pincode">Pincode:</label>
                <input type="text" class="form-control" name="pincode" id="pincode" placeholder="Pincode" required>
            </div>
            <div class="form-group">
                <label for="maximum_number_of_spots">Maximum Spots:</label>
                <input type="text" class="form-control" name="maximum_number_of_spots" id="maximum_number_of_spots"
                    placeholder="Maximum Number of Spots" min="1" max="30" required>
            </div>
            <div class="d-flex justify-content-start mt-3">
                <button type="submit" class="btn btn-primary">Add Lot</button> 
                <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-default ">Back</a>
            </div>
           
        </form>
    </div>

</body>

</html>
