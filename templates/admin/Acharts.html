{% extends 'baseadmin.html' %}

{% block content %}
<div class="container mt-5">
    <h3 class="text-center mb-4">📊 Admin Dashboard Charts</h3>

    <div class="text-center mb-4">
        <h4 class="p-3 bg-success text-white rounded shadow-sm d-inline-block">
            💰 Total Revenue: ₹{{ total_revenue }}
        </h4>
    </div>

    <div class="row g-4">
        <!-- User Earnings Chart -->
        <div class="col-md-6">
            <div class="card h-100 shadow">
                <div class="card-body">
                    <h5 class="card-title text-center">User Earnings</h5>
                    <canvas id="userEarningsChart" height="250"></canvas>
                </div>
            </div>
        </div>

        <!-- Reservation Count Per User -->
        <div class="col-md-6">
            <div class="card h-100 shadow">
                <div class="card-body">
                    <h5 class="card-title text-center">Reservation Count Per User</h5>
                    <canvas id="reservationCountChart" height="250"></canvas>
                </div>
            </div>
        </div>

        <!-- Parking Lot Revenue Distribution -->
        <div class="col-md-6">
            <div class="card h-100 shadow">
                <div class="card-body">
                    <h5 class="card-title text-center">Parking Lot Revenue Distribution</h5>
                    <canvas id="lotRevenueChart" height="250"></canvas>
                </div>
            </div>
        </div>

        <!-- Monthly Revenue Bar Chart -->
        <div class="col-md-6">
            <div class="card h-100 shadow">
                <div class="card-body">
                    <h5 class="card-title text-center">Monthly Revenue Overview</h5>
                    <canvas id="monthlyRevenueChart" height="250"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- JS Data -->
<script>
    const chartData = {{ chart_data | tojson }};
</script>

<!-- External JS file -->
<script src="{{ url_for('static', filename='js/admin_dashboard.js') }}"></script>
{% endblock %}
