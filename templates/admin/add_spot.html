<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Spot - Lot {{ lot.prime_location_name }}</title>

    <!-- Bootstrap CSS only -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .container {
            margin-top: 50px;
            max-width: 600px;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h3 {
            margin-bottom: 30px;
            text-align: center;
        }

        .btn {
            margin-right: 10px;
        }

        .alert {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h3>Add Spot to {{ lot.prime_location_name }}</h3>

        <form method="POST">
            <div class="form-group">
                <label for="status">Spot Status:</label>
                <select name="status" id="status" class="form-control">
                    <option value="A">Available</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Add Spot</button>
            <a href="{{ url_for('admin.lot_details', lot_id=lot.id) }}" class="btn btn-default">Cancel</a>
        </form>

        <!-- Flash Messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  {% for category, message in messages %}
  <div class="alert alert-{{ category }} alert-dismissible fade show text center" role="alert">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
  {% endif %}
  {% endwith %}


</body>

</html>
