<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/baseadmin.css') }}">

  <title>{% block title %}Admin Home Page{% endblock %}</title>
  {% block head %}{% endblock %}
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold text-white" href="{{ url_for('admin.admin_dashboard') }}">Parking App</a>

    <div class="collapse navbar-collapse justify-content-between">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="{{ url_for('admin.admin_dashboard') }}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('admin.user_list') }}">Users</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('admin.charts') }}">Summary</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('admin.search') }}">Search</a>
        </li>
      </ul>


      

      <ul class="navbar-nav mb-2 mb-lg-0 d-flex align-items-center">
        <div class="nav-item">
          <a href="{{ url_for('user.profile') }}" title="Edit Profile">
            <img src="{{ url_for('static', filename='images/avtar.png') }}" alt="Edit Profile" style="width:30px;"
              class="rounded-pill">
          </a>
          <span class="navbar-text text-white px-4 fw-semibold">Welcome Admin</span>
        </div>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

</body>

</html>
