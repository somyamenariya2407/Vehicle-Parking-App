<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Vehicle Parking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">

                        <h3 class="mb-4 text-center">Register</h3>

                        {% with messages = get_flashed_messages() %}
                        {% if messages %}
                        <div class="alert alert-{{ category }}text-center w-75 mx-auto">
                            {% for message in messages %}
                            {{ message }}
                            {% endfor %}
                        </div>
                        {% endif %}
                        {% endwith %}


                        <form action="/register" method="POST">

                            <div class="mb-3">
                                <label for="email" class="form-label">Email ID</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" required minlength="5">
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" name="name" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea name="address" rows="2" class="form-control" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="pincode" class="form-label">Pincode</label>
                                <input type="text" name="pincode" class="form-control" required pattern="\d{6}"
                                    title="Enter a valid 6-digit pincode">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">Register</button>
                            </div>
                        </form>
                        <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('auth.login') }}">Login
                                here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
