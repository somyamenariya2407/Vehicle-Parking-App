<div class="modal " id="releaseModal{{ reservation.id }}" tabindex="-1"
  aria-labelledby="releaseModalLabel{{ reservation.id }}" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">

      <form method="POST" action="{{ url_for('user.release_spot', reservation_id = reservation.id ) }}">
        <div class="modal-header">
          <h5 class="modal-title">Release Parking Spot</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="vehicle_id" value="{{ reservation.id }}">
          <div class="mb-2">
            <label>Spot ID:</label>
            <input type="text" class="form-control" value="{{ reservation.spot_id }}" readonly>
          </div>
          <div class="mb-2">
            <label>Vehicle Number:</label>
            <input type="text" class="form-control" value="{{ reservation.vehicle_number }}" readonly>
          </div>
          <div class="mb-2">
            <label>Parking Time:</label>
            <input type="text" class="form-control" value="{{ reservation.start_time }}" readonly>
          </div>
          <div class="mb-2">
            <label>Releasing Time:</label>
            <input type="text" class="form-control" value="{{ reservation.end_time or 'Not yet released.' }}" readonly>
          </div>
          <div class="mb-2">
            <label>Total Cost (₹):</label>
            {% if not reservation.end_time %}
            {% set duration = (now - reservation.start_time).total_seconds() %}
            {% set hours = duration / 3600 %}
            {% set est_cost = (hours * reservation.spot.lot.price) | round(2) %}
            <input type="text" class="form-control" value="{{ est_cost or 'Calculating' }}" readonly>
            {% endif %}
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-danger">Release</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
