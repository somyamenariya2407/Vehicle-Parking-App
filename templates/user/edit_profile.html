<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">

                        <h3 class="mb-4 text-center">Edit Profile</h3>

                        {% with messages = get_flashed_messages() %}
                        {% if messages %}
                        <div class="alert alert-{{ category }}text-center w-75 mx-auto">
                            {% for message in messages %}
                            {{ message }}
                            {% endfor %}
                        </div>
                        {% endif %}
                        {% endwith %}


                        <form action="{{ url_for('user.edit_profile') }}" method="POST">

                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <input type="text" name="address" class="form-control" value="{{ user.address }}"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Pincode</label>
                                <input type="text" name="pincode" class="form-control" value="{{ user.pincode }}"
                                    required>
                            </div>
                            <button type="submit" class="btn btn-primary">Update Profile</button>
                            <a href="{{ url_for('user.user_dashboard') }}" class="btn btn-secondary ms-2">Cancel</a>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
